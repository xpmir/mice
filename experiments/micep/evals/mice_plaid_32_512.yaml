id: eval_mice_plaid
title: cross_scorer_evaluation
description: Evaluation of MICE v2 Models

parent: ../_common_eval.yaml
module: Evaluation.experiment
pre_experiment: pre_experiment

#First stage: splade-v3
retriever: naver/splade-v3-distilbert

scorer_type: miceV2

max_query_length: 32
max_doc_length: 512

evaluation:
  #just for debugging
  in_domain: false
  beir13: false
  beir13_decontaminated: true
  lotte_search: true

use_plaid: true

plaid: #override _common.yaml for mice values
  max_doc_length: 512
  max_query_length: 32
  n_bits: 4

indexation:
  requirements: duration=5h & cpu(cores=16, mem=20G) & cuda(mem=40G)


grid_search:
  from_experiment:
  - train_micev2_ettin68m_l10+4_v3_plaid_128 #Version Ft with 128 bottlenexk
  - train_micev2_ettin150m_l12+4_v3_plaid_128
  - train_micev2_ettin400m_l12+4_plaid_128_fast
