id: eval_mice_32_512
title: cross_scorer_evaluation
description: Evaluation of MICE HF Scorer with different tokenization

parent: ../_common_eval.yaml
module: Evaluation.experiment
pre_experiment: pre_experiment

#First stage: splade-v3
retriever: naver/splade-v3-distilbert
scorer_type: auto

use_plaid: false
include_recall_100: true
max_query_length: 32
max_doc_length: 512

evaluation:
  in_domain: false
  beir13: false
  beir13_decontaminated: true
  lotte_search: true

grid_search:
  from_experiment:
  - train_micev2_ettin68m_l10+4_v3 #initial Ckpt
  - train_micev2_ettin68m_l10+4_v3_plaid_128 #Version Ft with 128 bottlenexk
  - train_micev2_ettin150m_l12+4_v3_plaid_128 #Version Ft with 128 bottlenexk
  - train_micev2_ettin400m_l12+4_v3
  - train_micev2_ettin400m_l12+4_plaid_128_fast
