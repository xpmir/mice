id: baseline_mores
title: "Mice-MiniLM Training"
description:
    Compare mice using 4 or 8 layers

module: MICE.experiments.mice_training
parent: ../mice_MiniLM_l4.yaml #same training params as Mice-l4+3
# pre_experiment: pre_experiment

seed: 12 # To mimick the HF xp
nb_repetitions: 3


base: microsoft/MiniLM-L12-H384-uncased
n_docs_ctx_layers: 12
n_contextualization_layers: 10
n_interaction_layers: 2

evaluation: #default = Minified tests
    all_datasets: false
    beir13: true
    in_domain: true
