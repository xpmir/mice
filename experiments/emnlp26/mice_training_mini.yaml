# Base Training for Mini MICE model.
# This config can't be run on its own, but it is used as a parent for all the Mini MICE training configs,
# which share the same training hyperparameters.

module: MICE.experiments.mice_training
# pre_experiment: pre_experiment

seed: 12
nb_repetitions: 3
retriever: ""

preprocessing:
    requirements: duration=8h & cpu(cores=8)

indexation:
    requirements: duration=8h & cpu(cores=5) & cuda(mem=10G)

validation:
    # Use 500 topics for validation
    size: 500

# Shared Training hyperparameters for all the Mini Mice Models
learner:
    optimization:
        steps_per_epoch: 100
        batch_size: 32
        max_epochs: 2000 # Sum is 2_500_000. Multiplied by BS of 32, it gives 80M samples, which is a bit above the size of the dataset
        num_warmup_steps: 5000 # Follows the original setup
        weight_decay: 0.00
        lr: 7e-6
        eps: 1.0e-8
    # sample_max: 2_000_000
    loss: marginMSE
    max_grad_norm: 1.0
    checkpoint_interval: 100
    validation_interval: 50
    validation_top_k: 100
    validation: nanobeir11
    requirements: duration=12h & cpu(cores=16) & cuda(mem=80G)

retrieval:
    requirements: duration=20h & cpu(cores=16) & cuda(mem=30G) * 2
    k: 1000
    batch_size: 64

evaluation: #default = Minified tests
    all_datasets: false
    in_domain: true
    beir13: true
