id: train_mice_ettin400-l16+4
title: "Mice-Ettin-150m Training"
description:
    Base Training for Ettin-150m-based MICE model.

module: MICE.experiments.mice_training
parent: mice_training_base.yaml
# pre_experiment: pre_experiment

seed: 12 # To mimick the HF xp
nb_repetitions: 3
retriever: ""

retrieval:
    requirements: duration=20h & cpu(cores=16) & cuda(mem=30G) * 4
    k: 1000
    batch_size: 64

evaluation: #default = Minified tests
    all_datasets: false
    in_domain: true
    beir13: true

base: jhu-clsp/ettin-encoder-400m
max_length: 1024
n_contextualization_layers: 16 # 28 layers
n_interaction_layers: 4
extra_attn_bias: true
