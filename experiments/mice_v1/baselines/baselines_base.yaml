id: baselines_base
title: "Base Experiment with all losses, including unnormalized liswise ones.."
description:
    Using the best parameters from the grid search,
    we run additional trainings validating on nanobeir to see the impact on OOD.

module: cross_encoders_training.experiment
# pre_experiment: pre_experiment

seed: 12 # To mimick the HF xp
nb_repetitions: 3

preprocessing:
    requirements: duration=8h & cpu(cores=8)

indexation:
    requirements: duration=8h & cpu(cores=4) & cuda(mem=20G)
    batch_size: 128

validation:
    # Use 500 topics maximum for validation
    size: 500

# This set of hyperparameters follows: https://github.com/huggingface/sentence-transformers/blob/9f76b5790fa8f0175ccdc27e41f9ae348f557144/examples/training/ms_marco/train_cross-encoder-v2.py
learner:
    optimization:
        steps_per_epoch: 100
        batch_size: 32
        max_epochs: 2000 # Sum is 2_500_000. Multiplied by BS of 32, it gives 80M samples, which is a bit above the size of the dataset
        num_warmup_steps: 20000 # Follows the original setup
        weight_decay: 0.00
        lr: 1e-5
        eps: 1.0e-8
    # sample_max: 2_000_000
    loss: marginMSE
    max_grad_norm: 1.0
    checkpoint_interval: 100
    validation_interval: 50
    validation_top_k: 100
    validation: nanobeir11
    requirements: duration=12h & cpu(cores=20) & cuda(mem=50G)


retrieval:
    requirements: duration=20h & cpu(cores=16) & cuda(mem=30G) * 2
    k: 1000
    batch_size: 64

evaluation:
    all_datasets: true


max_length: 1024

#### Params that are grid searched
grid_search:
    base:
        values_list:
            - google/electra-base-discriminator
            - jhu-clsp/ettin-encoder-150m
            # - bert-base-uncased
            # - FacebookAI/roberta-base
            # - microsoft/deberta-v3-base
