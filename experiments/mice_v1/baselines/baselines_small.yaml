id: baseline_small_CE
title: "Training small Cross-Encoder"
description:
    Models are trained with the same hyperparams as 'train_mice_miniLM_l4'
    Serving as a baseline for assessing their performance.

module: cross_encoders_training.experiment
export_trained_models: true
# pre_experiment: pre_experiment

seed: 12 # To mimick the HF xp
nb_repetitions: 3

preprocessing:
    requirements: duration=8h & cpu(cores=8)

indexation:
    requirements: duration=8h & cpu(cores=5) & cuda(mem=10G)

validation:
    # Use 500 topics for validation
    size: 500

# This set of hyperparameters follows: https://github.com/huggingface/sentence-transformers/blob/9f76b5790fa8f0175ccdc27e41f9ae348f557144/examples/training/ms_marco/train_cross-encoder-v2.py
learner:
    optimization:
        steps_per_epoch: 100
        batch_size: 32
        max_epochs: 2000 # Sum is 2_500_000. Multiplied by BS of 32, it gives 80M samples, which is a bit above the size of the dataset
        num_warmup_steps: 5000 # Follows the original setup
        weight_decay: 0.00
        lr: 7e-6
        eps: 1.0e-8
    # sample_max: 2_000_000
    loss: marginMSE
    max_grad_norm: 1.0
    checkpoint_interval: 100
    validation_interval: 50
    validation_top_k: 100
    validation: nanobeir11
    requirements: duration=12h & cpu(cores=16) & cuda(mem=80G)

retrieval:
    requirements: duration=20h & cpu(cores=16) & cuda(mem=30G) * 2
    k: 1000
    batch_size: 64

evaluation:
    all_datasets: true

max_length: 1024
grid_search:
    base:
        values_list:
            - microsoft/MiniLM-L12-H384-uncased
            - jhu-clsp/ettin-encoder-68m
            - jhu-clsp/ettin-encoder-32m
            - jhu-clsp/ettin-encoder-17m
