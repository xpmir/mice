id: train_mice_miniLM_L8_abl_loss
title: "Mice-MiniLM Training"
description:
    Base Training for MiniLM-based MICE model.

module: MICE.experiments.mice_training
# pre_experiment: pre_experiment
parent: ../mice_MiniLM_l8+3.yaml

seed: 12 # To mimick the HF xp
nb_repetitions: 2

#### Params that are grid searched
grid_search:
    n_contextualization_layers:
        values_list:
         - 8

    mask_cls_to_doc:
        values_list:
            - true
            - false

    learner.loss:
        values_list:
            - infoNCE_Colbertv2Neg
            - marginMSE
