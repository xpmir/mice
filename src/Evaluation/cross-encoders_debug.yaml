#   - naver/splade-v3-distilbert

preprocessing:
  requirements: duration=1h & cpu(cores=16, mem=10G) & cuda(mem=10G)

indexation:
  requirements: duration=8h & cpu(cores=4, mem=10G) & cuda(mem=30G)
  sparse2bmp_requirements: duration=8h & cpu(cores=8)
  batch_size: 256

retrieval:
  requirements: duration=10h & cpu(cores=4, mem=10G) & cuda(mem=20G)
  batch_size: 128
  k: 100

evaluation:
  #just for debugging
  test_max_topics: 100
  all_datasets: false
  datasets:
        - nfcorpus
        - touche
        - arguana
