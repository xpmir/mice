[build-system]
requires = ["setuptools>=61.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mice"
dynamic = ["version"]
description = "MICE: Minimal Interaction Cross-Encoders for Efficient Re-ranking"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "experimaestro-ir[neural]",
    "experimaestro>=2.1.0",
    "datamaestro",
    "datamaestro-ir",
    "ir-datasets",
    "pandas>=3.0.0",
    "tabulate>=0.9.0",
    "transformers[kernels]>=5.0.0",
    "xpm-torch>=0.3.0",
    "torch",
    "accelerate>=1.13.0",
    "tiktoken>=0.12.0",
    "sentencepiece>=0.2.1",
    "sentence-transformers>=6",
    "fast-plaid>=1.5.0",
    "datasets>=5.0.0",
    "impact-index>=1.7.0",
    "xpm-mlboard>=0.2.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools_scm]
version_file = "src/_version.py"

[tool.mypy]
plugins = ["experimaestro.mypy"]
mypy_path = "src"

[tool.uv]
default-groups = []
environments = [
    "sys_platform == 'darwin'",
    "sys_platform == 'linux'"
]

# Our cluster don't have Cuda 13 yet
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126", marker = "sys_platform != 'darwin'" }
experimaestro = { git = "https://github.com/experimaestro/experimaestro-python.git" }
experimaestro-ir = { git = "https://github.com/experimaestro/experimaestro-ir.git", tag = "v1.5.0" }


[dependency-groups]
dev = [
    "mypy>=1.10.0",
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "pytest-dependency>=0.6.0",
    "pytest-order>=1.0.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.9.9",
]
docs = [
    "sphinx>=6",
    "myst-parser>=2.0",
    "sphinx-rtd-theme>=2.0",
    "sphinx-codeautolink>=0.15",
    "sphinx-copybutton>=0.5",
    "sphinx-autobuild>=2024.10.3",
]
[tool.ruff]
src = ["src"]
include = ["src/**/*.py"]
